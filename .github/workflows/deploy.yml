name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            dockerchinmaya/indiathings-frontend:latest
            dockerchinmaya/indiathings-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [ci, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The EC2 self-hosted runner performs the deployment locally, so GitHub
    # does not need inbound SSH access to the instance.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy image on EC2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="dockerchinmaya/indiathings-frontend:${IMAGE_TAG}"
          docker pull "$image"

          docker rm -f cartwell-frontend 2>/dev/null || true
          docker run -d \
            --name cartwell-frontend \
            --restart unless-stopped \
            -p 80:80 \
            "$image"
