server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Let client-side React Router routes load directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted Vite assets for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
